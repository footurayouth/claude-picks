name: ledger
on:
  schedule:
    - cron: "30 21 * * 1-5"   # after the US close (21:00 UTC winter / 20:00 UTC summer)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: repo-writes, cancel-in-progress: false }
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history: mtm.py checks when each order line was committed
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q "pandas==2.2.3" "numpy<2.3" "yfinance==0.2.66"
      - run: python tests/test_fills.py
      - run: python check_orders.py || echo "::warning::orders.csv has invalid rows (mtm.py rejects them)"
      - run: python mtm.py
      - name: commit ledger
        run: |
          git config user.name "ledger-bot"; git config user.email "ledger-bot@users.noreply.github.com"
          git add equity.csv trades.csv state.json
          git diff --cached --quiet || git commit -qm "ledger $(date -u +%F)"
      - name: screen
        continue-on-error: true
        run: |
          python screen.py
          git add screen_latest.csv screen_date.txt
          git diff --cached --quiet || git commit -qm "screen $(date -u +%F)"
      - name: push
        run: |
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 15; done; exit 1
